<!doctype html>
<!-- kali-shell -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0b0d10" />
    <title>Kali Node</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --bg: #0b0d10;
        --surface: #14181e;
        --elevated: #1c222b;
        --fg: #e8edf2;
        --muted: #8b95a2;
        --subtle: #5c6570;
        --accent: #5b8fbf;
        --accent-fg: #0b0d10;
        --border: #242a32;
        --app-h: 100dvh;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font-family: "Segoe UI", system-ui, sans-serif; overflow: hidden; }
      button { font: inherit; color: inherit; background: var(--elevated); border: 1px solid var(--border); border-radius: 8px; min-height: 44px; padding: 0 12px; cursor: pointer; }
      button.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
      #app { display: flex; flex-direction: column; height: var(--app-h); }
      header, footer, .keys, .zoom { display: flex; align-items: center; gap: 8px; background: var(--surface); border-color: var(--border); }
      header { height: 36px; padding: 0 12px; justify-content: space-between; border-bottom: 1px solid var(--border); }
      .zoom { height: 40px; padding: 0 8px; border-bottom: 1px solid var(--border); }
      .zoom .ml { margin-left: auto; display: flex; gap: 6px; }
      footer { height: 40px; padding: 0 12px; justify-content: space-between; border-top: 1px solid var(--border); }
      .keys { flex-direction: column; align-items: stretch; padding: 8px; border-top: 1px solid var(--border); }
      .row { display: flex; flex-wrap: wrap; gap: 6px; }
      .row.arrows button { flex: 1; }
      .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--subtle); }
      #stage { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--bg); touch-action: none; }
      #layer { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: top left; }
      #layer img { position: absolute; inset: 0; width: 1280px; height: 720px; display: block; user-select: none; -webkit-user-drag: none; }
      #layer img.back { opacity: 0; }
      #cursor { position: absolute; width: 16px; height: 16px; border: 1px solid var(--accent); background: color-mix(in srgb, var(--accent) 30%, transparent); border-radius: 2px; transform: translate(-1px, -1px); pointer-events: none; left: 640px; top: 360px; }
      #sync { position: absolute; top: 8px; left: 0; right: 0; text-align: center; pointer-events: none; font-family: ui-monospace, monospace; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--subtle); display: none; }
      vite-error-overlay, .vite-error-overlay { display: none !important; }
      #gate { display: none; position: absolute; inset: 0; z-index: 40; align-items: center; justify-content: center; flex-direction: column; gap: 16px; background: color-mix(in srgb, var(--bg) 72%, transparent); }
      #gate.show { display: flex; }
      #kbdwrap { position: relative; height: 44px; min-width: 44px; }
      #kali-kbd { margin: 0; border: 0; padding: 8px; font-size: 16px; line-height: 20px; color: transparent; caret-color: transparent; background: transparent; outline: none; resize: none; overflow: hidden; opacity: 0.02; z-index: 80; -webkit-user-select: text; }
      #kali-kbd.is-closed { position: absolute; inset: 0; width: 100%; height: 100%; }
      #kali-kbd.is-open { position: fixed; left: 0; top: 0; width: 100%; height: 44px; z-index: 90; }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <p class="mono">KALI 2026.2 · XFCE</p>
        <button id="term" type="button">Terminal</button>
      </header>
      <div class="zoom">
        <button id="zout" type="button" aria-label="Zoom out">−</button>
        <p class="mono" id="zoomlab" style="width:48px;text-align:center">100%</p>
        <button id="zin" type="button" aria-label="Zoom in">+</button>
        <button id="fit" type="button">Fit</button>
        <div class="ml">
          <button id="touch" type="button" class="on">Touch</button>
          <button id="pointer" type="button">Pointer</button>
        </div>
      </div>
      <div id="stage">
        <div id="layer">
          <img id="f0" alt="Kali desktop" width="1280" height="720" />
          <img id="f1" class="back" alt="" width="1280" height="720" />
          <div id="cursor"></div>
        </div>
        <p id="sync">syncing</p>
        <div id="gate">
          <p class="mono">Kali Node</p>
          <button id="resume" type="button">Connect</button>
        </div>
      </div>
      <div class="keys">
        <div class="row">
          <button id="ctrl" type="button">Ctrl</button>
          <button id="alt" type="button">Alt</button>
          <button data-key="Escape" type="button">Esc</button>
          <button data-key="Tab" type="button">Tab</button>
          <button data-key="c" data-ctrl="1" type="button">Ctrl-C</button>
          <button data-key="/" type="button">/</button>
          <button data-key="-" type="button">−</button>
          <div id="kbdwrap">
            <button id="kbdbtn" type="button">Kbd</button>
            <textarea id="kali-kbd" class="is-closed" rows="1" inputmode="text" enterkeyhint="enter" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Remote keyboard"></textarea>
          </div>
        </div>
        <div class="row arrows">
          <button data-key="ArrowLeft" type="button">Left</button>
          <button data-key="ArrowDown" type="button">Down</button>
          <button data-key="ArrowUp" type="button">Up</button>
          <button data-key="ArrowRight" type="button">Right</button>
        </div>
      </div>
      <footer>
        <p class="mono" id="status">connected</p>
        <button id="hang" type="button">Hang up</button>
      </footer>
    </div>
    <script>
      const W = 1280, H = 720, TAP = 12, LONG_MS = 420;
      const POINTER = "https://raw.githubusercontent.com/onnxscibroccoli/omnikali-link/main/omnikali.json";
      const FALLBACK = "https://hardcover-segments-fever-jefferson.trycloudflare.com";
      const stage = document.getElementById("stage");
      const layer = document.getElementById("layer");
      const imgs = [document.getElementById("f0"), document.getElementById("f1")];
      const cursor = document.getElementById("cursor");
      const sync = document.getElementById("sync");
      const zoomlab = document.getElementById("zoomlab");
      const status = document.getElementById("status");
      const kbd = document.getElementById("kali-kbd");
      const kbdbtn = document.getElementById("kbdbtn");
      const root = document.documentElement;
      const view = { scale: 1, x: 0, y: 0 };
      const cur = { x: 640, y: 360 };
      let mode = "touch";
      let kbdOpen = false;
      let ctrl = false;
      let alt = false;
      let etag = "";
      let front = 0;
      let urls = [null, null];
      let lastFrame = Date.now();
      let chain = Promise.resolve();
      let inflight = false;
      let paused = false;
      let pollTimer = 0;
      let lastRtt = 200;
      let ORIGIN = "";
      let misses = 0;
      let resolving = false;

      function remoteMode() {
        return location.hostname.endsWith(".vercel.app");
      }
      function remember(url) {
        ORIGIN = url;
        try { localStorage.setItem("omni-origin", url); } catch (e) {}
      }
      function forget() {
        ORIGIN = "";
        try { localStorage.removeItem("omni-origin"); } catch (e) {}
      }
      function api(path) {
        if (remoteMode()) return ORIGIN ? ORIGIN + path : null;
        return path;
      }
      function okOrigin(value) {
        try {
          const u = new URL(value);
          const host = u.hostname.toLowerCase();
          if (u.protocol !== "https:") return false;
          if (host.startsWith("api.") || host.startsWith("www.")) return false;
          return host.endsWith(".trycloudflare.com") || host.endsWith(".serveousercontent.com") || host.endsWith(".serveo.net") || host.endsWith(".localhost.run") || host.endsWith(".lhr.life") || host.endsWith(".pinggy.io") || host.endsWith(".loca.lt");
        } catch { return false; }
      }
      async function probe(url) {
        try {
          const ac = new AbortController();
          const t = setTimeout(() => ac.abort(), 900);
          const r = await fetch(url + "/api/desktop", { method: "HEAD", cache: "no-store", signal: ac.signal, headers: { Accept: "image/jpeg" } });
          clearTimeout(t);
          const type = (r.headers.get("content-type") || "");
          if (r.status === 304 || (r.ok && type.includes("image"))) return true;
          if (r.status === 404 || r.status === 405 || r.status === 501) {
            const ac2 = new AbortController();
            const t2 = setTimeout(() => ac2.abort(), 900);
            const r2 = await fetch(url + "/api/desktop", { cache: "no-store", signal: ac2.signal, headers: { Accept: "image/jpeg", "If-None-Match": '"probe"' } });
            clearTimeout(t2);
            return r2.status === 304 || (r2.ok && (r2.headers.get("content-type") || "").includes("image"));
          }
          return false;
        } catch { return false; }
      }
      async function resolveOrigin() {
        if (!remoteMode() || resolving) return;
        resolving = true;
        const had = ORIGIN;
        try {
          const cands = [];
          if (okOrigin(FALLBACK)) cands.push(FALLBACK);
          const extras = await Promise.all([
            fetch("/origin.json", { cache: "no-store" }).then((r) => r.json()).then((j) => j && j.url).catch(() => null),
            fetch(POINTER, { cache: "no-store" }).then((r) => r.json()).then((j) => j && j.url).catch(() => null),
          ]);
          for (const u of extras) {
            if (okOrigin(u)) cands.push(String(u).replace(/\/$/, ""));
          }
          const cached = (() => { try { return localStorage.getItem("omni-origin") || ""; } catch (e) { return ""; } })();
          if (okOrigin(cached)) cands.push(cached);
          const uniq = [...new Set(cands)];
          const found = await Promise.all(uniq.map(async (c) => ({ c, ok: await probe(c) })));
          const live = found.find((x) => x.ok);
          if (live) remember(live.c);
          else if (!had) forget();
        } finally {
          resolving = false;
        }
      }

      function apply() {
        layer.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.scale})`;
        zoomlab.textContent = Math.round(view.scale * 100) + "%";
      }
      function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
      function fit() {
        const r = stage.getBoundingClientRect();
        if (r.width < 8 || r.height < 8) return;
        const s = Math.min(r.width / W, r.height / H);
        view.scale = s;
        view.x = (r.width - W * s) / 2;
        view.y = (r.height - H * s) / 2;
        apply();
      }
      function hostToDesk(cx, cy) {
        const r = stage.getBoundingClientRect();
        return {
          x: clamp((cx - r.left - view.x) / view.scale, 0, W - 1),
          y: clamp((cy - r.top - view.y) / view.scale, 0, H - 1),
        };
      }
      function setCursor(x, y, send) {
        cur.x = x; cur.y = y;
        cursor.style.left = x + "px";
        cursor.style.top = y + "px";
        if (send) post({ op: "move", x, y });
      }
      function post(body) {
        const url = api("/api/desktop");
        if (!url) return;
        const run = () => fetch(url, {
          method: "POST",
          mode: "cors",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify(body),
        }).then(() => undefined, () => undefined);
        if (body.op === "move" || body.op === "scroll") { void run(); return; }
        chain = chain.then(run, run);
      }
      function sendKey(key, useCtrl, useAlt) {
        post({ op: "key", key, ctrl: !!(useCtrl || ctrl), alt: !!(useAlt || alt) });
        if (ctrl && key !== "Control") { ctrl = false; document.getElementById("ctrl").classList.remove("on"); }
      }

      async function tick() {
        if (paused) return;
        if (inflight) return;
        if (document.visibilityState === "hidden") {
          pollTimer = setTimeout(() => void tick(), 800);
          return;
        }
        const remote = remoteMode();
        const url = api("/api/desktop");
        if (!url) {
          sync.style.display = "block";
          if (remote) void resolveOrigin();
          pollTimer = setTimeout(() => void tick(), 400);
          return;
        }
        inflight = true;
        const started = Date.now();
        const ac = new AbortController();
        const abortMs = remote
          ? Math.min(1200, Math.max(600, Math.round((lastRtt || 200) * 2)))
          : Math.min(4000, Math.max(1200, Math.round((lastRtt || 200) * 2)));
        const killer = setTimeout(() => ac.abort(), abortMs);
        let got304 = false;
        let gotFrame = false;
        try {
          const headers = etag ? { "If-None-Match": etag } : {};
          const res = await fetch(url, { cache: "no-store", mode: "cors", headers, signal: ac.signal });
          if (res.status === 304) {
            lastFrame = Date.now();
            lastRtt = Math.min(900, Math.max(60, Date.now() - started));
            sync.style.display = "none";
            got304 = true;
            misses = 0;
            return;
          }
          if (!res.ok || !(res.headers.get("content-type") || "").includes("image")) {
            misses += 1;
            if (remote && misses >= 3) { forget(); void resolveOrigin(); }
            if (Date.now() - lastFrame > 6000) sync.style.display = "block";
            return;
          }
          const blob = await res.blob();
          if (blob.size < 1000) return;
          etag = res.headers.get("ETag") || "";
          lastRtt = Math.min(900, Math.max(60, Date.now() - started));
          const back = front ^ 1;
          const next = URL.createObjectURL(blob);
          imgs[back].onload = () => {
            imgs[back].classList.remove("back");
            imgs[front].classList.add("back");
            if (urls[front]) URL.revokeObjectURL(urls[front]);
            front = back;
            lastFrame = Date.now();
            sync.style.display = "none";
            if (!paused) status.textContent = kbdOpen ? "keyboard" : "connected";
          };
          urls[back] = next;
          imgs[back].src = next;
          gotFrame = true;
          misses = 0;
        } catch {
          misses += 1;
          if (remote && misses >= 3) { forget(); void resolveOrigin(); }
          if (Date.now() - lastFrame > 6000) sync.style.display = "block";
        } finally {
          clearTimeout(killer);
          inflight = false;
          if (!paused) {
            const wait = got304
              ? Math.min(remote ? 400 : 400, Math.max(remote ? 120 : 80, Math.round(lastRtt * (remote ? 0.5 : 0.5))))
              : gotFrame
                ? Math.min(remote ? 250 : 280, Math.max(remote ? 80 : 40, Math.round(lastRtt * (remote ? 0.3 : 0.25))))
                : Math.min(1200, Math.max(400, lastRtt * 2));
            pollTimer = setTimeout(() => void tick(), wait);
          }
        }
      }

      const vv = window.visualViewport;
      function placeKbd() {
        if (!kbdOpen) { kbd.style.top = ""; kbd.style.left = ""; kbd.style.width = ""; return; }
        kbd.style.top = (vv ? vv.offsetTop : 0) + "px";
        kbd.style.left = (vv ? vv.offsetLeft : 0) + "px";
        kbd.style.width = (vv ? vv.width : window.innerWidth) + "px";
      }
      function setAppH() {
        root.style.setProperty("--app-h", Math.round((vv && vv.height) || window.innerHeight) + "px");
        fit();
        placeKbd();
      }
      setAppH();
      window.addEventListener("resize", setAppH);
      vv && vv.addEventListener("resize", setAppH);
      vv && vv.addEventListener("scroll", placeKbd);
      new ResizeObserver(fit).observe(stage);

      void (async () => {
        if (remoteMode()) {
          if (okOrigin(FALLBACK)) remember(FALLBACK);
          void resolveOrigin();
        } else {
          imgs[0].src = "/api/desktop";
        }
        void tick();
      })();
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible" && !paused) void tick();
      });
      setInterval(() => {
        if (paused || document.visibilityState === "hidden") return;
        const url = api("/api/status");
        if (!url) return;
        fetch(url, { cache: "no-store", mode: "cors" }).catch(() => undefined);
      }, 12000);

      document.getElementById("zout").onclick = () => { view.scale = clamp(view.scale * 0.85, 0.4, 4); apply(); };
      document.getElementById("zin").onclick = () => { view.scale = clamp(view.scale * 1.18, 0.4, 4); apply(); };
      document.getElementById("fit").onclick = fit;
      document.getElementById("touch").onclick = () => {
        mode = "touch";
        document.getElementById("touch").classList.add("on");
        document.getElementById("pointer").classList.remove("on");
      };
      document.getElementById("pointer").onclick = () => {
        mode = "pointer";
        document.getElementById("pointer").classList.add("on");
        document.getElementById("touch").classList.remove("on");
      };
      document.getElementById("term").onpointerdown = (e) => { e.preventDefault(); post({ op: "term" }); if (kbdOpen) kbd.focus(); };
      document.getElementById("hang").onclick = () => {
        paused = true;
        clearTimeout(pollTimer);
        document.getElementById("gate").classList.add("show");
        status.textContent = "paused";
      };
      document.getElementById("resume").onclick = () => {
        paused = false;
        document.getElementById("gate").classList.remove("show");
        status.textContent = "connected";
        void tick();
        if (remoteMode()) void resolveOrigin();
      };
      document.getElementById("ctrl").onpointerdown = (e) => { e.preventDefault(); ctrl = !ctrl; e.currentTarget.classList.toggle("on", ctrl); };
      document.getElementById("alt").onpointerdown = (e) => { e.preventDefault(); alt = !alt; e.currentTarget.classList.toggle("on", alt); };
      document.querySelectorAll("[data-key]").forEach((btn) => {
        btn.onpointerdown = (e) => {
          e.preventDefault();
          sendKey(btn.getAttribute("data-key"), btn.getAttribute("data-ctrl") === "1", false);
          if (kbdOpen) kbd.focus();
        };
      });

      let composing = false;
      kbd.addEventListener("pointerdown", (e) => e.stopPropagation());
      kbd.addEventListener("focus", () => {
        kbdOpen = true;
        kbd.classList.add("is-open");
        kbd.classList.remove("is-closed");
        kbdbtn.classList.add("on");
        status.textContent = "keyboard";
        placeKbd();
        const vk = navigator.virtualKeyboard;
        if (vk) { vk.overlaysContent = true; vk.show && vk.show(); }
      });
      kbd.addEventListener("blur", () => {
        setTimeout(() => {
          if (document.activeElement === kbd) return;
          if (kbd.dataset.closing === "1") {
            delete kbd.dataset.closing;
            kbdOpen = false;
            kbd.classList.remove("is-open");
            kbd.classList.add("is-closed");
            kbdbtn.classList.remove("on");
            status.textContent = "connected";
            return;
          }
          if (kbdOpen) kbd.focus({ preventScroll: true });
        }, 120);
      });
      kbdbtn.addEventListener("pointerdown", (e) => {
        if (!kbdOpen) return;
        e.preventDefault();
        kbd.dataset.closing = "1";
        kbd.blur();
      });
      setInterval(() => { if (kbdOpen && document.activeElement !== kbd && !composing) kbd.focus({ preventScroll: true }); }, 400);
      kbd.addEventListener("compositionstart", () => { composing = true; });
      kbd.addEventListener("compositionend", () => { composing = false; if (kbd.value) { post({ op: "type", text: kbd.value }); kbd.value = ""; } });
      kbd.addEventListener("input", (e) => {
        if (composing) return;
        const t = e.inputType || "";
        if (t === "deleteContentBackward" || t === "deleteContentForward") {
          sendKey(t === "deleteContentForward" ? "Delete" : "Backspace");
          kbd.value = "";
          return;
        }
        if (e.data) post({ op: "type", text: e.data });
        else if (kbd.value) post({ op: "type", text: kbd.value });
        kbd.value = "";
      });
      kbd.addEventListener("keydown", (e) => {
        e.stopPropagation();
        if (e.key === "Unidentified" || e.key === "Process") return;
        const special = ["Enter", "Tab", "Escape", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Home", "End", "Delete"];
        if (e.key === "Backspace" && !kbd.value) { e.preventDefault(); sendKey("Backspace"); }
        else if (special.includes(e.key)) { e.preventDefault(); sendKey(e.key); }
      });
      kbd.addEventListener("paste", (e) => {
        const text = e.clipboardData && e.clipboardData.getData("text");
        if (!text) return;
        e.preventDefault();
        post({ op: "type", text });
      });

      const pts = new Map();
      let down = null;
      let dragging = false;
      let longT = null;
      let two = null;
      let suppress = false;
      function clearLong() { if (longT) { clearTimeout(longT); longT = null; } }
      stage.addEventListener("pointerdown", (e) => {
        stage.setPointerCapture(e.pointerId);
        pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (pts.size === 2) {
          clearLong(); dragging = false; down = null; suppress = true;
          const a = [...pts.values()];
          two = { dist: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y), scale: view.scale, x: view.x, y: view.y, mx: (a[0].x + a[1].x) / 2, my: (a[0].y + a[1].y) / 2, t: Date.now(), mode: "none" };
          return;
        }
        const desk = hostToDesk(e.clientX, e.clientY);
        down = { x: e.clientX, y: e.clientY, dx: desk.x, dy: desk.y, t: Date.now(), moved: false, armed: false };
        dragging = false;
        if (mode === "touch") setCursor(desk.x, desk.y, true);
        longT = setTimeout(() => {
          if (!down || down.moved) return;
          if (mode === "pointer") { down.armed = true; return; }
          post({ op: "click", btn: 3 });
          down = null;
        }, LONG_MS);
      });
      stage.addEventListener("pointermove", (e) => {
        if (!pts.has(e.pointerId)) return;
        pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (pts.size >= 2 && two) {
          const a = [...pts.values()];
          const dist = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
          const mx = (a[0].x + a[1].x) / 2, my = (a[0].y + a[1].y) / 2;
          if (two.mode !== "zoom" && Math.abs(dist - two.dist) < 22) {
            const dy = my - two.my;
            if (Math.abs(dy) > 14) { two.mode = "scroll"; post({ op: "scroll", dy }); two.my = my; }
            return;
          }
          two.mode = "zoom";
          const next = clamp(two.scale * (dist / Math.max(24, two.dist)), 0.4, 4);
          const host = stage.getBoundingClientRect();
          const deskX = (two.mx - host.left - two.x) / two.scale;
          const deskY = (two.my - host.top - two.y) / two.scale;
          view.scale = next;
          view.x = mx - host.left - deskX * next;
          view.y = my - host.top - deskY * next;
          apply();
          return;
        }
        if (!down) return;
        const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
        if (moved > TAP) { down.moved = true; clearLong(); }
        if (mode === "pointer") {
          const nx = clamp(cur.x + (e.clientX - down.x) / view.scale, 0, W - 1);
          const ny = clamp(cur.y + (e.clientY - down.y) / view.scale, 0, H - 1);
          down.x = e.clientX; down.y = e.clientY;
          if (down.armed && !dragging) { dragging = true; post({ op: "move", x: cur.x, y: cur.y }); post({ op: "btn", btn: 1, down: true }); }
          setCursor(nx, ny, true);
          return;
        }
        if (view.scale > 1.05 && moved > 8 && !dragging) {
          view.x += e.clientX - down.x; view.y += e.clientY - down.y;
          down.x = e.clientX; down.y = e.clientY; apply();
          return;
        }
        if (moved > TAP && !dragging) { dragging = true; post({ op: "move", x: down.dx, y: down.dy }); post({ op: "btn", btn: 1, down: true }); }
        if (dragging) { const d = hostToDesk(e.clientX, e.clientY); setCursor(d.x, d.y, true); }
      });
      function up(e) {
        pts.delete(e.pointerId);
        if (pts.size === 0) {
          const t = two; two = null;
          if (suppress) {
            suppress = false;
            if (t && t.mode === "none" && Date.now() - t.t < 420) post({ op: "click", btn: 3 });
            down = null; dragging = false; clearLong();
            if (kbdOpen) kbd.focus();
            return;
          }
        }
        clearLong();
        if (dragging) { post({ op: "btn", btn: 1, down: false }); dragging = false; down = null; if (kbdOpen) kbd.focus(); return; }
        if (!down) { if (kbdOpen) kbd.focus(); return; }
        const tap = !down.moved && Date.now() - down.t <= LONG_MS + 80;
        if (mode === "pointer") {
          if (down.armed) post({ op: "click", btn: 3 });
          else if (tap) post({ op: "click", btn: 1 });
        } else if (tap) {
          const d = hostToDesk(e.clientX, e.clientY);
          setCursor(d.x, d.y, true);
          post({ op: "click", btn: 1 });
        }
        down = null;
        if (kbdOpen) kbd.focus();
      }
      stage.addEventListener("pointerup", up);
      stage.addEventListener("pointercancel", up);
      stage.addEventListener("contextmenu", (e) => e.preventDefault());
      stage.addEventListener("wheel", (e) => {
        if (e.ctrlKey || e.metaKey) { e.preventDefault(); const f = e.deltaY < 0 ? 1.08 : 0.92; const before = hostToDesk(e.clientX, e.clientY); view.scale = clamp(view.scale * f, 0.4, 4); const r = stage.getBoundingClientRect(); view.x = e.clientX - r.left - before.x * view.scale; view.y = e.clientY - r.top - before.y * view.scale; apply(); return; }
        post({ op: "scroll", dy: e.deltaY });
      }, { passive: false });

      window.addEventListener("keydown", (e) => {
        if (e.target === kbd) return;
        if (e.metaKey) return;
        e.preventDefault();
        sendKey(e.key, e.ctrlKey, e.altKey);
      });
    </script>
  </body>
